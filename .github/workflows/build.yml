name: Build Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Optimized APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Release APK with R8 Full Mode
        run: |
          gradle assembleRelease --stacktrace

      - name: Measure and Verify APK Size
        run: |
          echo "=========================================="
          echo "         APK BUILD SUCCESSFUL             "
          echo "=========================================="
          ls -la app/build/outputs/apk/release/
          APK_FILE=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: Release APK not generated!"
            exit 1
          fi
          SIZE_HUMAN=$(du -h "$APK_FILE" | cut -f1)
          SIZE_BYTES=$(stat -c %s "$APK_FILE")
          echo "APK Location : $APK_FILE"
          echo "APK Size     : $SIZE_HUMAN ($SIZE_BYTES bytes)"
          echo "=========================================="
          echo "APK_SIZE=$SIZE_HUMAN" >> $GITHUB_STEP_SUMMARY
          echo "APK_BYTES=$SIZE_BYTES" >> $GITHUB_STEP_SUMMARY

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloner-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
